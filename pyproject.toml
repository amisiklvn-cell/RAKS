[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raks-ai"
version = "0.1.0"
description = "RAKS AI - hybrid personal assistant and development agent"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "RAKS AI contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]

[project.scripts]
raks = "raks.app:main"

[tool.setuptools]
packages = ["raks"]
